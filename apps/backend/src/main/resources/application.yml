spring:
  application:
    name: payment-quality-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_quality_lab}
    username: ${DB_USER:payment_quality}
    password: ${DB_PASSWORD:payment_quality_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/merchant,classpath:db/migration/payment
    baseline-on-migrate: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/payment-quality
          jwk-set-uri: http://localhost:8081/realms/payment-quality/protocol/openid-connect/certs

server:
  port: 8080

payment-quality:
  phase: foundation

logging:
  level:
    lab.paymentquality: DEBUG
