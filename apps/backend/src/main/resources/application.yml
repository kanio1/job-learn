spring:
  application:
    name: payment-quality-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_quality_lab}
    username: ${DB_USER:payment_quality}
    password: ${DB_PASSWORD:payment_quality_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/tenant,classpath:db/migration/merchant,classpath:db/migration/payment,classpath:db/migration/shared,classpath:db/migration/audit
    baseline-on-migrate: false
  modulith:
    events:
      republish-outstanding-events-on-restart: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/payment-quality
          jwk-set-uri: http://localhost:8081/realms/payment-quality/protocol/openid-connect/certs

server:
  port: 8080
  # Local/test backend does not trust Forwarded or X-Forwarded-* headers.
  # Link-producing payment endpoints use relative Location values unless a future trusted-proxy profile says otherwise.
  forward-headers-strategy: none
  error:
    include-binding-errors: never
    include-message: never
    include-stacktrace: never

payment-quality:
  phase: foundation
  security:
    authorized-party: ${EXPECTED_AZP:payment-quality-dashboard}

logging:
  level:
    lab.paymentquality: DEBUG
