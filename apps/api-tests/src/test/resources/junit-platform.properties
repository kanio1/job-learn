# JUnit Platform configuration for the black-box API test framework.
#
# Parallelism is OFF for Phase 1-6: single shared Testcontainers stack
# (PostgreSQL + Keycloak + backend) must be started once and reused.
# Enable parallel execution in Phase 7+ only after verifying test data isolation.
#
# *Spec files run via maven-failsafe-plugin (integration-test/verify).
# *Test files run via maven-surefire-plugin (test phase, offline-safe).

junit.jupiter.execution.parallel.enabled=false
