services:
  payment-quality-postgres:
    image: docker.io/library/postgres:18
    container_name: payment-quality-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - payment-quality-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  payment-quality-keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: payment-quality-keycloak
    # Production `start` + HTTP listener. Public issuer is the host-published URL so
    # browsers on :3000 can complete OIDC. Back-channel (token/JWKS) follows the
    # request host when apps call Keycloak on the compose network.
    # https://www.keycloak.org/server/hostname
    command:
      - start
      - --import-realm
      - --http-enabled=true
      - --hostname=http://localhost:${KEYCLOAK_PORT:-8081}
      - --hostname-backchannel-dynamic=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ../keycloak/realms/payment-quality-realm.json:/opt/keycloak/data/import/payment-quality-realm.json:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "bash -ec ': >/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 10s
      retries: 20

volumes:
  payment-quality-postgres-data:
